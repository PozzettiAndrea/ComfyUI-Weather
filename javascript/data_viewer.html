<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0d1117; color: #c9d1d9; overflow-y: auto; overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
.panel {
    position: relative; border-bottom: 1px solid #21262d;
}
.panel-header {
    display: flex; align-items: center; gap: 6px; padding: 4px 8px;
    background: #161b22; border-bottom: 1px solid #21262d; font-size: 10px;
    flex-wrap: wrap;
}
.panel-header .loc-label { font-weight: bold; color: #58a6ff; font-size: 11px; }
.panel-header select, .panel-header button {
    background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
    border-radius: 4px; padding: 1px 5px; font-size: 10px; cursor: pointer;
}
.panel-header button:hover { background: #30363d; }
.panel-header button.active { background: #1f6feb; border-color: #388bfd; color: #fff; }
.var-chip {
    display: inline-flex; align-items: center; gap: 2px; padding: 0 5px;
    border-radius: 3px; font-size: 10px; cursor: pointer; transition: opacity 0.15s;
}
.var-chip.off { opacity: 0.3; }
.var-chip .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
canvas { display: block; width: 100%; }
.tooltip {
    position: absolute; display: none; background: rgba(22,27,34,0.95);
    border: 1px solid #30363d; padding: 5px 8px; border-radius: 5px;
    font-size: 10px; pointer-events: none; z-index: 10; white-space: nowrap;
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
}
#loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    color: #484f58; font-size: 13px;
}
</style>
</head>
<body>
<div id="loading">Waiting for data...</div>
<div id="panels"></div>

<script>
const COLORS = [
    "#58a6ff","#f0883e","#3fb950","#bc8cff",
    "#ff7b72","#79c0ff","#d2a8ff","#ffa657",
    "#56d364","#ff9bce","#a5d6ff","#ffc680",
];

const panelsContainer = document.getElementById("panels");
const loadingEl = document.getElementById("loading");
const panels = []; // array of panel state objects

const PAD = { top: 14, right: 14, bottom: 32, left: 56 };
const PANEL_H = 260; // height per panel in pixels

function createPanel(locData, index) {
    const models = {};
    const modelKeys = [];

    if (locData.models && typeof locData.models === "object") {
        for (const [mk, md] of Object.entries(locData.models)) {
            models[mk] = { timestamps: md.timestamps||[], variables: md.variables||{}, units: md.units||{} };
            modelKeys.push(mk);
        }
    }
    if (modelKeys.length === 0 && locData.variables) {
        models["default"] = { timestamps: locData.timestamps||[], variables: locData.variables||{}, units: locData.units||{} };
        modelKeys.push("default");
    }

    const label = locData._label || `Location ${index + 1}`;
    const currentModel = modelKeys[0] || null;
    const enabledVars = new Set(currentModel ? Object.keys(models[currentModel].variables) : []);

    const state = {
        models, modelKeys, label, currentModel, enabledVars,
        overlayMode: false,
        viewXStart: 0, viewXEnd: getMaxLenFor(models, modelKeys),
        isDragging: false, dragStartX: 0, dragViewStart: 0, dragViewEnd: 0,
    };

    // DOM
    const el = document.createElement("div");
    el.className = "panel";

    const header = document.createElement("div");
    header.className = "panel-header";

    const locLabel = document.createElement("span");
    locLabel.className = "loc-label";
    locLabel.textContent = label;
    header.appendChild(locLabel);

    // Model selector
    if (modelKeys.length > 1) {
        const sel = document.createElement("select");
        for (const mk of modelKeys) {
            const opt = document.createElement("option");
            opt.value = mk; opt.textContent = mk;
            sel.appendChild(opt);
        }
        sel.value = currentModel;
        sel.addEventListener("change", () => {
            state.currentModel = sel.value;
            rebuildChips();
            renderPanel(state);
        });
        header.appendChild(sel);

        const overlayBtn = document.createElement("button");
        overlayBtn.textContent = "Overlay";
        overlayBtn.title = "Show all models on one chart";
        overlayBtn.addEventListener("click", () => {
            state.overlayMode = !state.overlayMode;
            overlayBtn.classList.toggle("active", state.overlayMode);
            renderPanel(state);
        });
        header.appendChild(overlayBtn);
    }

    const varsDiv = document.createElement("div");
    varsDiv.style.cssText = "display:flex;gap:3px;flex-wrap:wrap;flex:1;";
    header.appendChild(varsDiv);

    el.appendChild(header);

    const canvasWrap = document.createElement("div");
    canvasWrap.style.position = "relative";
    const canvas = document.createElement("canvas");
    canvas.style.cssText = `width:100%;height:${PANEL_H}px;cursor:crosshair;`;
    canvasWrap.appendChild(canvas);

    const tooltip = document.createElement("div");
    tooltip.className = "tooltip";
    canvasWrap.appendChild(tooltip);

    el.appendChild(canvasWrap);
    panelsContainer.appendChild(el);

    state.el = el;
    state.canvas = canvas;
    state.ctx = canvas.getContext("2d");
    state.tooltip = tooltip;
    state.varsDiv = varsDiv;

    // Variable chips
    function rebuildChips() {
        varsDiv.innerHTML = "";
        const m = models[state.currentModel];
        if (!m) return;
        Object.keys(m.variables).forEach((vk, i) => {
            const chip = document.createElement("span");
            chip.className = "var-chip" + (enabledVars.has(vk) ? "" : " off");
            const c = COLORS[i % COLORS.length];
            chip.innerHTML = `<span class="dot" style="background:${c}"></span>${vk}`;
            chip.style.color = c;
            chip.addEventListener("click", () => {
                if (enabledVars.has(vk)) enabledVars.delete(vk); else enabledVars.add(vk);
                chip.classList.toggle("off", !enabledVars.has(vk));
                renderPanel(state);
            });
            varsDiv.appendChild(chip);
        });
    }
    rebuildChips();

    // Mouse events
    canvas.addEventListener("mousemove", (e) => onMouseMove(e, state));
    canvas.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        state.isDragging = true;
        state.dragStartX = e.clientX - canvas.getBoundingClientRect().left;
        state.dragViewStart = state.viewXStart;
        state.dragViewEnd = state.viewXEnd;
        canvas.style.cursor = "grabbing";
    });
    canvas.addEventListener("mouseup", () => { state.isDragging = false; canvas.style.cursor = "crosshair"; });
    canvas.addEventListener("mouseleave", () => {
        state.isDragging = false; tooltip.style.display = "none"; canvas.style.cursor = "crosshair";
    });
    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left;
        const pr = getPR(state);
        if (px < pr.x || px > pr.x + pr.w) return;
        const frac = (px - pr.x) / pr.w;
        const range = state.viewXEnd - state.viewXStart;
        const factor = e.deltaY > 0 ? 1.15 : 1 / 1.15;
        const maxLen = getMaxLenFor(state.models, state.modelKeys);
        const newRange = Math.max(10, Math.min(maxLen, range * factor));
        const center = state.viewXStart + frac * range;
        state.viewXStart = center - frac * newRange;
        state.viewXEnd = center + (1 - frac) * newRange;
        renderPanel(state);
    }, { passive: false });
    canvas.addEventListener("dblclick", () => {
        state.viewXStart = 0;
        state.viewXEnd = getMaxLenFor(state.models, state.modelKeys);
        renderPanel(state);
    });

    panels.push(state);
    return state;
}

function getPR(state) {
    const W = state.canvas.clientWidth;
    return { x: PAD.left, y: PAD.top, w: W - PAD.left - PAD.right, h: PANEL_H - PAD.top - PAD.bottom };
}

function getMaxLenFor(models, modelKeys) {
    let max = 0;
    for (const mk of modelKeys) {
        for (const vk in models[mk].variables) {
            max = Math.max(max, models[mk].variables[vk].length);
        }
    }
    return max || 1;
}

function getSeries(state) {
    const series = [];
    if (state.overlayMode) {
        for (let mi = 0; mi < state.modelKeys.length; mi++) {
            const mk = state.modelKeys[mi];
            const m = state.models[mk];
            for (const vk of state.enabledVars) {
                if (!m.variables[vk]) continue;
                series.push({
                    label: `${mk} · ${vk}`, values: m.variables[vk],
                    timestamps: m.timestamps, color: COLORS[mi % COLORS.length],
                    unit: m.units?.[vk]||"", varKey: vk, modelKey: mk,
                });
            }
        }
    } else if (state.currentModel && state.models[state.currentModel]) {
        const m = state.models[state.currentModel];
        let ci = 0;
        for (const vk of state.enabledVars) {
            if (!m.variables[vk]) continue;
            series.push({
                label: vk, values: m.variables[vk],
                timestamps: m.timestamps, color: COLORS[ci % COLORS.length],
                unit: m.units?.[vk]||"", varKey: vk, modelKey: state.currentModel,
            });
            ci++;
        }
    }
    return series;
}

function renderPanel(state) {
    const { canvas, ctx } = state;
    const dpr = window.devicePixelRatio || 1;
    const W = canvas.clientWidth;
    canvas.width = W * dpr; canvas.height = PANEL_H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = "#0d1117";
    ctx.fillRect(0, 0, W, PANEL_H);

    const pr = getPR(state);
    if (pr.w <= 0 || pr.h <= 0) return;

    const series = getSeries(state);
    if (series.length === 0) {
        ctx.fillStyle = "#484f58"; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
        ctx.fillText("No variables selected", W / 2, PANEL_H / 2);
        return;
    }

    const maxLen = getMaxLenFor(state.models, state.modelKeys);
    if (state.viewXEnd <= state.viewXStart) { state.viewXStart = 0; state.viewXEnd = maxLen; }
    const xS = Math.max(0, Math.floor(state.viewXStart));
    const xE = Math.min(maxLen, Math.ceil(state.viewXEnd));
    const xRange = (state.viewXEnd - state.viewXStart) || 1;

    let yMin = Infinity, yMax = -Infinity;
    for (const s of series) {
        for (let i = xS; i < Math.min(xE, s.values.length); i++) {
            const v = s.values[i];
            if (v != null && isFinite(v)) { if (v < yMin) yMin = v; if (v > yMax) yMax = v; }
        }
    }
    if (!isFinite(yMin)) { yMin = 0; yMax = 1; }
    const yPad = (yMax - yMin) * 0.1 || 1;
    yMin -= yPad; yMax += yPad;
    const yRange = yMax - yMin || 1;

    function toX(i) { return pr.x + ((i - state.viewXStart) / xRange) * pr.w; }
    function toY(v) { return pr.y + pr.h - ((v - yMin) / yRange) * pr.h; }

    // Y grid
    const yTicks = niceScale(yMin, yMax, 5);
    ctx.strokeStyle = "#21262d"; ctx.lineWidth = 1;
    ctx.font = "9px monospace"; ctx.fillStyle = "#484f58"; ctx.textAlign = "right";
    for (const yt of yTicks) {
        const y = toY(yt); if (y < pr.y || y > pr.y + pr.h) continue;
        ctx.beginPath(); ctx.moveTo(pr.x, y); ctx.lineTo(pr.x + pr.w, y); ctx.stroke();
        ctx.fillText(fmtVal(yt), pr.x - 5, y + 3);
    }

    // X grid
    const xStep = Math.max(1, Math.round(xRange / 7));
    ctx.textAlign = "center";
    for (let i = xS; i < xE; i += xStep) {
        const x = toX(i);
        ctx.strokeStyle = "#21262d"; ctx.beginPath(); ctx.moveTo(x, pr.y); ctx.lineTo(x, pr.y + pr.h); ctx.stroke();
        const ts = series[0].timestamps?.[i] || "";
        ctx.fillStyle = "#484f58";
        ctx.fillText(ts.length > 10 ? ts.slice(5, 16).replace("T", " ") : ts, x, pr.y + pr.h + 14);
    }

    // Border
    ctx.strokeStyle = "#30363d"; ctx.lineWidth = 1;
    ctx.strokeRect(pr.x, pr.y, pr.w, pr.h);

    // Clip + draw series
    ctx.save();
    ctx.beginPath(); ctx.rect(pr.x, pr.y, pr.w, pr.h); ctx.clip();

    for (const s of series) {
        ctx.strokeStyle = s.color; ctx.lineWidth = 1.6;
        ctx.beginPath(); let started = false;
        for (let i = xS; i < Math.min(xE, s.values.length); i++) {
            const v = s.values[i];
            if (v == null || !isFinite(v)) { started = false; continue; }
            if (!started) { ctx.moveTo(toX(i), toY(v)); started = true; }
            else ctx.lineTo(toX(i), toY(v));
        }
        ctx.stroke();

        // Area fill
        if (series.length <= 3) {
            const hex = s.color;
            const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
            ctx.fillStyle = `rgba(${r},${g},${b},0.06)`;
            ctx.beginPath(); let first = true;
            for (let i = xS; i < Math.min(xE, s.values.length); i++) {
                const v = s.values[i]; if (v == null || !isFinite(v)) continue;
                if (first) { ctx.moveTo(toX(i), pr.y + pr.h); ctx.lineTo(toX(i), toY(v)); first = false; }
                else ctx.lineTo(toX(i), toY(v));
            }
            if (!first) { ctx.lineTo(toX(Math.min(xE, s.values.length) - 1), pr.y + pr.h); ctx.closePath(); ctx.fill(); }
        }
    }
    ctx.restore();

    // Legend (compact)
    let lx = pr.x + 6, ly = pr.y + 11;
    ctx.font = "bold 9px sans-serif";
    for (const s of series) {
        ctx.fillStyle = s.color;
        ctx.fillRect(lx, ly - 5, 8, 3);
        ctx.fillStyle = "#c9d1d9"; ctx.textAlign = "left";
        const lbl = state.overlayMode ? s.label : `${s.label} (${s.unit})`;
        ctx.fillText(lbl, lx + 11, ly);
        ly += 12;
    }

    // Unit on y-axis
    const units = [...new Set(series.map(s => s.unit).filter(Boolean))];
    if (units.length) {
        ctx.save(); ctx.fillStyle = "#484f58"; ctx.font = "9px sans-serif"; ctx.textAlign = "center";
        ctx.translate(10, pr.y + pr.h / 2); ctx.rotate(-Math.PI / 2);
        ctx.fillText(units.join(" / "), 0, 0); ctx.restore();
    }
}

function onMouseMove(e, state) {
    const { canvas, tooltip } = state;
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const pr = getPR(state);

    if (state.isDragging) {
        const dx = px - state.dragStartX;
        const pxPerIdx = pr.w / (state.dragViewEnd - state.dragViewStart);
        const shift = -dx / pxPerIdx;
        state.viewXStart = state.dragViewStart + shift;
        state.viewXEnd = state.dragViewEnd + shift;
        renderPanel(state);
        return;
    }

    if (px < pr.x || px > pr.x + pr.w || py < pr.y || py > pr.y + pr.h) {
        tooltip.style.display = "none"; return;
    }

    const xRange = (state.viewXEnd - state.viewXStart) || 1;
    const dataIdx = Math.round(state.viewXStart + ((px - pr.x) / pr.w) * xRange);
    const series = getSeries(state);
    if (dataIdx < 0 || series.length === 0) { tooltip.style.display = "none"; return; }

    const ts = series[0].timestamps?.[dataIdx] || "";
    const lines = [];
    if (ts) lines.push(`<div style="color:#8b949e;margin-bottom:2px;">${ts.replace("T"," ")}</div>`);
    for (const s of series) {
        const v = s.values[dataIdx];
        if (v == null) continue;
        const dot = `<span style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${s.color};margin-right:3px;"></span>`;
        const lbl = state.overlayMode ? `${s.modelKey}·${s.varKey}` : s.varKey;
        lines.push(`${dot}<b>${fmtVal(v)}</b> ${s.unit} <span style="color:#484f58">${lbl}</span>`);
    }

    if (lines.length > 0) {
        tooltip.innerHTML = lines.join("<br>");
        tooltip.style.display = "block";
        let tx = px + 12, ty = py - 8;
        if (tx + 180 > canvas.clientWidth) tx = px - 180;
        tooltip.style.left = tx + "px"; tooltip.style.top = ty + "px";
    } else tooltip.style.display = "none";

    // Crosshair
    renderPanel(state);
    const ctx = state.ctx;
    const crossX = pr.x + ((dataIdx - state.viewXStart) / xRange) * pr.w;
    ctx.strokeStyle = "rgba(139,148,158,0.3)"; ctx.lineWidth = 1;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(crossX, pr.y); ctx.lineTo(crossX, pr.y + pr.h); ctx.stroke();
    ctx.setLineDash([]);

    // Dots
    const yMin = getYBounds(state, series).min, yRange = getYBounds(state, series).range;
    for (const s of series) {
        const v = s.values[dataIdx];
        if (v == null || !isFinite(v)) continue;
        const y = pr.y + pr.h - ((v - yMin) / (yRange || 1)) * pr.h;
        ctx.fillStyle = s.color;
        ctx.beginPath(); ctx.arc(crossX, y, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#0d1117"; ctx.lineWidth = 1.5; ctx.stroke();
    }
}

function getYBounds(state, series) {
    let yMin = Infinity, yMax = -Infinity;
    const xS = Math.max(0, Math.floor(state.viewXStart));
    const xE = Math.ceil(state.viewXEnd);
    for (const s of series) {
        for (let i = xS; i < Math.min(xE, s.values.length); i++) {
            const v = s.values[i];
            if (v != null && isFinite(v)) { if (v < yMin) yMin = v; if (v > yMax) yMax = v; }
        }
    }
    if (!isFinite(yMin)) { yMin = 0; yMax = 1; }
    const pad = (yMax - yMin) * 0.1 || 1;
    return { min: yMin - pad, max: yMax + pad, range: (yMax + pad) - (yMin - pad) };
}

function niceScale(min, max, n) {
    const range = max - min || 1;
    const rough = range / n;
    const mag = Math.pow(10, Math.floor(Math.log10(rough)));
    const norm = rough / mag;
    let step;
    if (norm <= 1.5) step = mag; else if (norm <= 3) step = 2*mag;
    else if (norm <= 7) step = 5*mag; else step = 10*mag;
    const r = []; let v = Math.ceil(min / step) * step;
    while (v <= max) { r.push(v); v += step; }
    return r;
}

function fmtVal(v) {
    if (Math.abs(v) >= 1000) return v.toFixed(0);
    if (Math.abs(v) >= 10) return v.toFixed(1);
    return v.toFixed(2);
}

function renderAll() {
    for (const p of panels) renderPanel(p);
}

function sendInfo() {
    if (!window.parent || window.parent === window) return;
    const parts = panels.map(p => {
        const n = getMaxLenFor(p.models, p.modelKeys);
        return `${p.label}: ${p.modelKeys.length} model(s), ${p.enabledVars.size} var(s), ${n} hrs`;
    });
    window.parent.postMessage({ type: "DATA_INFO", info: parts.join("  |  ") }, "*");
}

// --- Load data ---
window.addEventListener("message", async (event) => {
    if (event.data?.type === "LOAD_DATA") {
        loadingEl.textContent = "Loading data...";
        try {
            const resp = await fetch(event.data.filepath);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();

            // Clear existing panels
            panelsContainer.innerHTML = "";
            panels.length = 0;

            // Handle both old format (single dataset) and new format (locations array)
            let locations;
            if (data.locations && Array.isArray(data.locations)) {
                locations = data.locations;
            } else {
                locations = [data];
            }

            for (let i = 0; i < locations.length; i++) {
                createPanel(locations[i], i);
            }

            loadingEl.textContent = "";
            renderAll();
            sendInfo();
        } catch (err) {
            loadingEl.textContent = `Error: ${err.message}`;
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({ type: "DATA_ERROR", error: err.message }, "*");
            }
        }
    }
});

window.addEventListener("resize", renderAll);
</script>
</body>
</html>
