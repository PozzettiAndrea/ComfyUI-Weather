<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a1a2e;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    height: 100vh;
}
#viewer { position: relative; flex: 1; overflow: hidden; }
canvas#canvas { display: block; position: absolute; top: 0; left: 0; cursor: crosshair; }
#tooltip {
    position: absolute; display: none;
    background: rgba(0,0,0,0.85); padding: 4px 8px; border-radius: 3px;
    font-size: 11px; pointer-events: none; white-space: nowrap; z-index: 10;
}
#colorbar {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    width: 20px; height: 60%;
    border: 1px solid rgba(255,255,255,0.3); border-radius: 2px;
}
#colorbar-labels {
    position: absolute; right: 38px; top: 50%; transform: translateY(-50%);
    height: 60%; display: flex; flex-direction: column; justify-content: space-between;
    font-size: 11px; font-weight: bold; color: #000; pointer-events: none;
}
#loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 13px; color: #888;
}
/* Time bar */
#timebar {
    background: #161622; border-top: 1px solid #333;
    padding: 4px 10px; display: none; gap: 8px; align-items: center;
    font-size: 11px; flex-shrink: 0;
}
#timebar.visible { display: flex; }
#t-play {
    background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 1px 6px; font-size: 12px; cursor: pointer;
    width: 24px; text-align: center;
}
#t-play:hover { background: #444; }
#t-slider {
    flex: 1; height: 4px; accent-color: #3b82f6; cursor: pointer;
}
#t-label {
    color: #aaa; font-family: monospace; font-size: 10px;
    min-width: 130px; text-align: right; white-space: nowrap;
}
/* Controls bar */
#controls {
    background: #1a1a1a; border-top: 1px solid #444;
    padding: 5px 10px; display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; font-size: 11px; flex-shrink: 0;
}
#controls label { display: flex; align-items: center; gap: 3px; cursor: pointer; color: #bbb; }
#controls select {
    background: #2a2a2a; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 1px 4px; font-size: 10px; max-width: 180px;
}
#controls button {
    background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 1px 8px; font-size: 10px; cursor: pointer;
}
#controls button:hover { background: #444; }
.sep { width: 1px; height: 14px; background: #444; }
/* Settings overlay */
#settingsOverlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 1999; display: none;
}
#settingsOverlay.visible { display: block; }
#settingsPanel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #222; border: 1px solid #555; border-radius: 6px;
    padding: 14px 16px; z-index: 2000; display: none;
    width: 280px; max-height: 90%; overflow-y: auto;
}
#settingsPanel.visible { display: block; }
#settingsPanel h3 { margin-bottom: 10px; font-size: 12px; color: #ddd; }
.sr { display: flex; align-items: center; margin-bottom: 8px; font-size: 11px; }
.sr label { width: 95px; flex-shrink: 0; color: #aaa; }
.sr input, .sr select {
    flex: 1; background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 3px 6px; font-size: 11px;
}
.sr input[type="number"] { width: 70px; }
.sr input[type="checkbox"] { flex: 0; width: 14px; height: 14px; }
.sr input:disabled { opacity: 0.4; }
.btn-row {
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid #444;
}
.btn-row button {
    background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 3px 14px; font-size: 11px; cursor: pointer;
}
.btn-row button:hover { background: #444; }
.btn-row button.primary { background: #2563eb; border-color: #3b82f6; }
.btn-row button.primary:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div id="viewer">
    <canvas id="canvas"></canvas>
    <div id="tooltip"></div>
    <canvas id="colorbar"></canvas>
    <div id="colorbar-labels">
        <span id="cb-max"></span>
        <span id="cb-mid"></span>
        <span id="cb-min"></span>
    </div>
    <div id="loading">Waiting for data...</div>
    <div id="settingsOverlay"></div>
    <div id="settingsPanel">
        <h3>Settings</h3>
        <div class="sr"><label>Colormap</label>
            <select id="s-colormap">
                <option value="Viridis" selected>Viridis</option>
                <option value="RdBu_r">RdBu (diverging)</option>
                <option value="Plasma">Plasma</option>
                <option value="Inferno">Inferno</option>
                <option value="Turbo">Turbo</option>
                <option value="Coolwarm">Coolwarm</option>
            </select>
        </div>
        <div class="sr"><label>Auto Range</label><input type="checkbox" id="s-autorange" checked></div>
        <div class="sr"><label>Color Min</label><input type="number" id="s-cmin" step="any" disabled></div>
        <div class="sr"><label>Color Max</label><input type="number" id="s-cmax" step="any" disabled></div>
        <div class="sr"><label>Grid Color</label><input type="color" id="s-gridcolor" value="#000000"></div>
        <div class="sr"><label>Grid Width</label><input type="number" id="s-gridwidth" min="0.1" max="5" step="0.1" value="0.5"></div>
        <div class="sr"><label>Grid Opacity</label><input type="number" id="s-gridopacity" min="0" max="1" step="0.05" value="0.15"></div>
        <div class="sr"><label>Coast Width</label><input type="number" id="s-coastwidth" min="0.1" max="5" step="0.1" value="0.8"></div>
        <div class="sr"><label>Coast Opacity</label><input type="number" id="s-coastopacity" min="0" max="1" step="0.05" value="0.5"></div>
        <div class="btn-row">
            <button id="s-cancel">Cancel</button>
            <button id="s-apply" class="primary">Apply</button>
        </div>
    </div>
</div>
<div id="timebar">
    <button id="t-play" title="Play/Pause">&#9654;</button>
    <input type="range" id="t-slider" min="0" max="0" value="0" step="1">
    <span id="t-label">--</span>
</div>
<div id="controls">
    <label><input type="checkbox" id="c-grid" checked> Grid</label>
    <label><input type="checkbox" id="c-coast" checked> Coast</label>
    <div class="sep"></div>
    <label>Field <select id="c-field"></select></label>
    <div class="sep"></div>
    <button id="c-settings">Settings</button>
    <button id="c-reset">Reset</button>
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const loadingEl = document.getElementById("loading");
const viewer = document.getElementById("viewer");

let gridData = null;      // current field metadata + .values = current 2D frame
let allFields = {};
let gridInitTime = null;  // model initialization/analysis time
let viewState = { offsetX: 0, offsetY: 0, scale: 1 };
let lockedBaseScale = null;
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let dragOffset = { x: 0, y: 0 };

// Time-series state
let frames = [];          // array of 2D arrays (one per time step)
let timestamps = [];      // parallel array of timestamp strings
let currentFrame = 0;
let playing = false;
let playTimer = null;
let playSpeed = 200;      // ms per frame

let settings = {
    colormap: "Viridis", autoRange: true, cmin: 0, cmax: 1,
    gridColor: "#000000", gridWidth: 0.5, gridOpacity: 0.15,
    coastWidth: 0.8, coastOpacity: 0.5,
    showGrid: true, showCoast: true,
};

const COLORMAPS = {
    RdBu_r: [
        [0.0,[103,0,31]],[0.1,[178,24,43]],[0.2,[214,96,77]],
        [0.3,[244,165,130]],[0.4,[253,219,199]],[0.5,[247,247,247]],
        [0.6,[209,229,240]],[0.7,[146,197,222]],[0.8,[67,147,195]],
        [0.9,[33,102,172]],[1.0,[5,48,97]]
    ],
    Viridis: [
        [0.0,[68,1,84]],[0.125,[72,36,117]],[0.25,[56,88,140]],
        [0.375,[39,126,142]],[0.5,[31,161,135]],[0.625,[74,194,109]],
        [0.75,[159,218,58]],[0.875,[222,240,39]],[1.0,[253,231,37]]
    ],
    Plasma: [
        [0.0,[13,8,135]],[0.125,[84,2,163]],[0.25,[139,10,165]],
        [0.375,[185,50,137]],[0.5,[219,92,104]],[0.625,[244,136,73]],
        [0.75,[254,188,43]],[0.875,[240,230,33]],[1.0,[240,249,33]]
    ],
    Inferno: [
        [0.0,[0,0,4]],[0.125,[31,12,72]],[0.25,[85,15,109]],
        [0.375,[136,34,106]],[0.5,[186,54,85]],[0.625,[227,89,51]],
        [0.75,[249,140,10]],[0.875,[249,201,50]],[1.0,[252,255,164]]
    ],
    Turbo: [
        [0.0,[48,18,59]],[0.125,[62,109,204]],[0.25,[32,185,232]],
        [0.375,[23,232,162]],[0.5,[117,251,76]],[0.625,[213,226,26]],
        [0.75,[252,166,10]],[0.875,[230,84,8]],[1.0,[122,4,3]]
    ],
    Coolwarm: [
        [0.0,[59,76,192]],[0.25,[141,176,254]],[0.5,[221,221,221]],
        [0.75,[245,152,105]],[1.0,[180,4,38]]
    ],
};

function lerp(cmap, t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 0; i < cmap.length - 1; i++) {
        if (t >= cmap[i][0] && t <= cmap[i+1][0]) {
            const f = (t - cmap[i][0]) / (cmap[i+1][0] - cmap[i][0]);
            const a = cmap[i][1], b = cmap[i+1][1];
            return [
                Math.round(a[0]+f*(b[0]-a[0])),
                Math.round(a[1]+f*(b[1]-a[1])),
                Math.round(a[2]+f*(b[2]-a[2]))
            ];
        }
    }
    return cmap[cmap.length-1][1];
}

function sendToParent(type, data = {}) {
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type, ...data }, "*");
    }
}

function persistState() {
    const state = JSON.stringify({
        viewState,
        settings,
        selectedField: fieldSelect.value,
        lockedBaseScale,
        currentFrame,
    });
    sendToParent("VIEW_STATE", { state });
}

function getBaseScale(rows, cols) {
    if (lockedBaseScale) return lockedBaseScale;
    const W = viewer.clientWidth, H = viewer.clientHeight;
    return Math.min(H / rows, W / cols);
}

function clampPan() {
    if (!gridData) return;
    const W = viewer.clientWidth, H = viewer.clientHeight;
    const vals = gridData.values;
    const rows = vals.length, cols = vals[0].length;
    const s = getBaseScale(rows, cols) * viewState.scale;
    const mapW = cols * s, mapH = rows * s;
    if (mapW <= W) viewState.offsetX = (W - mapW) / 2;
    else viewState.offsetX = Math.min(W * 0.25, Math.max(W - mapW - W * 0.25, viewState.offsetX));
    if (mapH <= H) viewState.offsetY = (H - mapH) / 2;
    else viewState.offsetY = Math.min(H * 0.25, Math.max(H - mapH - H * 0.25, viewState.offsetY));
}

// --- Prepare frames from loaded data ---
// Detects 3D (time-series) vs 2D (single frame) values
function prepareFrames(fieldData) {
    const vals = fieldData.values;
    if (!vals || !vals.length) {
        frames = [];
        timestamps = [];
        return;
    }
    // 3D: vals[t][row][col] — first element is an array of arrays
    if (Array.isArray(vals[0]) && Array.isArray(vals[0][0])) {
        frames = vals;
        timestamps = fieldData.timestamps || [];
        // Pad timestamps if shorter
        while (timestamps.length < frames.length) {
            timestamps.push(`Frame ${timestamps.length}`);
        }
    } else {
        // 2D: single frame
        frames = [vals];
        timestamps = [fieldData.timestamp || ""];
    }
}

function setFrame(idx) {
    if (idx < 0 || idx >= frames.length) return;
    currentFrame = idx;
    gridData.values = frames[currentFrame];
    slider.value = currentFrame;
    updateTimeLabel();
    render();
}

function updateTimeLabel() {
    const ts = timestamps[currentFrame] || "";
    // Show compact: strip seconds, show frame index
    const display = ts.replace("T", " ");
    timeLabel.textContent = `${currentFrame + 1}/${frames.length}  ${display}`;
}

function render() {
    if (!gridData) return;

    const dpr = window.devicePixelRatio || 1;
    const W = viewer.clientWidth;
    const H = viewer.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const vals = gridData.values;
    const rows = vals.length;
    const cols = vals[0].length;
    const cmap = COLORMAPS[settings.colormap] || COLORMAPS.RdBu_r;

    // Compute data value range for current frame
    let dataMin = Infinity, dataMax = -Infinity;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const v = vals[r][c];
            if (v < dataMin) dataMin = v;
            if (v > dataMax) dataMax = v;
        }
    }
    gridData._vmin = dataMin;
    gridData._vmax = dataMax;

    const vmin = settings.autoRange ? dataMin : settings.cmin;
    const vmax = settings.autoRange ? dataMax : settings.cmax;
    const vrange = vmax - vmin || 1;
    const latsAscending = gridData.latitude[0] < gridData.latitude[rows - 1];

    const baseScale = getBaseScale(rows, cols);
    const s = baseScale * viewState.scale;
    const mapW = cols * s;
    const mapH = rows * s;
    const ox = viewState.offsetX;
    const oy = viewState.offsetY;

    // Clear
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, 0, W, H);

    // Heatmap
    const offscreen = document.createElement("canvas");
    offscreen.width = W;
    offscreen.height = H;
    const offCtx = offscreen.getContext("2d");
    const imgData = offCtx.createImageData(W, H);
    const d = imgData.data;
    const bgR = 26, bgG = 26, bgB = 46;
    for (let py = 0; py < H; py++) {
        let gi = Math.floor(((py - oy) / mapH) * rows);
        if (latsAscending) gi = rows - 1 - gi;
        const rowOOB = gi < 0 || gi >= rows;
        for (let px = 0; px < W; px++) {
            const idx = (py * W + px) * 4;
            if (rowOOB) {
                d[idx] = bgR; d[idx+1] = bgG; d[idx+2] = bgB; d[idx+3] = 255;
                continue;
            }
            const gj = Math.floor(((px - ox) / mapW) * cols);
            if (gj < 0 || gj >= cols) {
                d[idx] = bgR; d[idx+1] = bgG; d[idx+2] = bgB; d[idx+3] = 255;
                continue;
            }
            const t = (vals[gi][gj] - vmin) / vrange;
            const c = lerp(cmap, t);
            d[idx] = c[0]; d[idx+1] = c[1]; d[idx+2] = c[2]; d[idx+3] = 255;
        }
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.drawImage(offscreen, 0, 0);

    // Coastlines
    if (settings.showCoast && gridData._coastlines) {
        const lats = gridData.latitude, lons = gridData.longitude;
        const latMin = Math.min(lats[0], lats[lats.length-1]);
        const latMax = Math.max(lats[0], lats[lats.length-1]);
        const lonMin = Math.min(lons[0], lons[lons.length-1]);
        const lonMax = Math.max(lons[0], lons[lons.length-1]);
        const latR = latMax - latMin || 1, lonR = lonMax - lonMin || 1;
        ctx.save();
        ctx.beginPath();
        ctx.rect(ox, oy, mapW, mapH);
        ctx.clip();
        ctx.strokeStyle = `rgba(255,255,255,${settings.coastOpacity})`;
        ctx.lineWidth = settings.coastWidth;
        for (const seg of gridData._coastlines) {
            ctx.beginPath();
            let started = false;
            for (const [lon, lat] of seg) {
                const nx = (lon - lonMin) / lonR;
                const ny = (latMax - lat) / latR;
                const px = ox + nx * mapW;
                const py = oy + ny * mapH;
                if (!started) { ctx.moveTo(px, py); started = true; }
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
        }
        ctx.restore();
    }

    // Grid lines
    if (settings.showGrid) {
        const cellW = mapW / cols;
        const cellH = mapH / rows;
        if (cellW > 3 || cellH > 3) {
            const gc = settings.gridColor;
            const gr = parseInt(gc.slice(1,3),16), gg = parseInt(gc.slice(3,5),16), gb = parseInt(gc.slice(5,7),16);
            ctx.strokeStyle = `rgba(${gr},${gg},${gb},${settings.gridOpacity})`;
            ctx.lineWidth = settings.gridWidth;
            if (cellH > 3) {
                for (let i = 0; i <= rows; i++) {
                    const py = oy + (i / rows) * mapH;
                    if (py >= -1 && py <= H + 1) {
                        ctx.beginPath(); ctx.moveTo(ox, py); ctx.lineTo(ox + mapW, py); ctx.stroke();
                    }
                }
            }
            if (cellW > 3) {
                for (let j = 0; j <= cols; j++) {
                    const px = ox + (j / cols) * mapW;
                    if (px >= -1 && px <= W + 1) {
                        ctx.beginPath(); ctx.moveTo(px, oy); ctx.lineTo(px, oy + mapH); ctx.stroke();
                    }
                }
            }
        }
    }

    // Colorbar
    renderColorbar(vmin, vmax, cmap);

    // Info to parent
    const tsLabel = timestamps[currentFrame] || gridData.timestamp || "";
    sendToParent("GRID_INFO", {
        info: {
            variable: gridData.long_name || gridData.variable,
            unit: gridData.unit,
            timestamp: tsLabel,
            initTime: gridInitTime,
            rows, cols,
            frames: frames.length,
            frame: currentFrame + 1,
            vmin: vmin.toFixed(1), vmax: vmax.toFixed(1),
            latRange: gridData.latitude[0].toFixed(1) + "\u00b0 to " + gridData.latitude[rows-1].toFixed(1) + "\u00b0",
            lonRange: gridData.longitude[0].toFixed(1) + "\u00b0 to " + gridData.longitude[cols-1].toFixed(1) + "\u00b0",
        }
    });

    persistState();
}

function renderColorbar(vmin, vmax, cmap) {
    const cb = document.getElementById("colorbar");
    const c = cb.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    cb.width = 20 * dpr;
    cb.height = cb.clientHeight * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const h = cb.clientHeight;
    for (let y = 0; y < h; y++) {
        const col = lerp(cmap, y / h);
        c.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
        c.fillRect(0, y, 20, 1);
    }
    document.getElementById("cb-max").textContent = vmax.toFixed(1);
    document.getElementById("cb-mid").textContent = ((vmin + vmax) / 2).toFixed(1);
    document.getElementById("cb-min").textContent = vmin.toFixed(1);
}

// --- Time controls ---
const timebar = document.getElementById("timebar");
const slider = document.getElementById("t-slider");
const timeLabel = document.getElementById("t-label");
const playBtn = document.getElementById("t-play");

slider.addEventListener("input", () => {
    setFrame(parseInt(slider.value));
});

playBtn.addEventListener("click", () => {
    if (playing) {
        stopPlay();
    } else {
        startPlay();
    }
});

function startPlay() {
    if (frames.length <= 1) return;
    playing = true;
    playBtn.textContent = "\u23F8"; // pause icon
    playTimer = setInterval(() => {
        let next = currentFrame + 1;
        if (next >= frames.length) next = 0;
        setFrame(next);
    }, playSpeed);
}

function stopPlay() {
    playing = false;
    playBtn.textContent = "\u25B6"; // play icon
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

function setupTimeControls() {
    if (frames.length > 1) {
        slider.min = 0;
        slider.max = frames.length - 1;
        slider.value = currentFrame;
        timebar.classList.add("visible");
        updateTimeLabel();
    } else {
        timebar.classList.remove("visible");
    }
}

// --- Controls ---
const gridToggle = document.getElementById("c-grid");
const coastToggle = document.getElementById("c-coast");
const fieldSelect = document.getElementById("c-field");

gridToggle.addEventListener("change", () => { settings.showGrid = gridToggle.checked; render(); });
coastToggle.addEventListener("change", () => { settings.showCoast = coastToggle.checked; render(); });
fieldSelect.addEventListener("change", () => {
    const name = fieldSelect.value;
    if (allFields[name]) {
        stopPlay();
        gridData = allFields[name];
        prepareFrames(allFields[name]);
        currentFrame = 0;
        gridData.values = frames[0];
        viewState = { offsetX: 0, offsetY: 0, scale: 1 };
        setupTimeControls();
        render();
    }
});
document.getElementById("c-reset").addEventListener("click", () => {
    viewState = { offsetX: 0, offsetY: 0, scale: 1 };
    if (gridData) lockedBaseScale = Math.min(viewer.clientHeight / gridData.values.length, viewer.clientWidth / gridData.values[0].length);
    render();
});

// --- Settings ---
const settingsPanel = document.getElementById("settingsPanel");
const settingsOverlay = document.getElementById("settingsOverlay");
const autoRangeCheck = document.getElementById("s-autorange");
const cminInput = document.getElementById("s-cmin");
const cmaxInput = document.getElementById("s-cmax");

function openSettings() {
    document.getElementById("s-colormap").value = settings.colormap;
    autoRangeCheck.checked = settings.autoRange;
    cminInput.value = gridData ? gridData._vmin.toFixed(2) : settings.cmin;
    cmaxInput.value = gridData ? gridData._vmax.toFixed(2) : settings.cmax;
    cminInput.disabled = settings.autoRange;
    cmaxInput.disabled = settings.autoRange;
    document.getElementById("s-gridcolor").value = settings.gridColor;
    document.getElementById("s-gridwidth").value = settings.gridWidth;
    document.getElementById("s-gridopacity").value = settings.gridOpacity;
    document.getElementById("s-coastwidth").value = settings.coastWidth;
    document.getElementById("s-coastopacity").value = settings.coastOpacity;
    settingsPanel.classList.add("visible");
    settingsOverlay.classList.add("visible");
}
function closeSettings() {
    settingsPanel.classList.remove("visible");
    settingsOverlay.classList.remove("visible");
}
autoRangeCheck.addEventListener("change", () => {
    cminInput.disabled = autoRangeCheck.checked;
    cmaxInput.disabled = autoRangeCheck.checked;
});
document.getElementById("c-settings").addEventListener("click", openSettings);
settingsOverlay.addEventListener("click", closeSettings);
document.getElementById("s-cancel").addEventListener("click", closeSettings);
document.getElementById("s-apply").addEventListener("click", () => {
    settings.colormap = document.getElementById("s-colormap").value;
    settings.autoRange = autoRangeCheck.checked;
    if (!settings.autoRange) {
        settings.cmin = parseFloat(cminInput.value);
        settings.cmax = parseFloat(cmaxInput.value);
    }
    settings.gridColor = document.getElementById("s-gridcolor").value;
    settings.gridWidth = parseFloat(document.getElementById("s-gridwidth").value);
    settings.gridOpacity = parseFloat(document.getElementById("s-gridopacity").value);
    settings.coastWidth = parseFloat(document.getElementById("s-coastwidth").value);
    settings.coastOpacity = parseFloat(document.getElementById("s-coastopacity").value);
    closeSettings();
    render();
});

// --- Mouse ---
canvas.addEventListener("mousemove", (e) => {
    if (!gridData) return;
    if (isDragging) {
        viewState.offsetX = dragOffset.x + (e.clientX - dragStart.x);
        viewState.offsetY = dragOffset.y + (e.clientY - dragStart.y);
        clampPan();
        render();
        return;
    }
    const rect = canvas.getBoundingClientRect();
    const px = e.clientX - rect.left, py = e.clientY - rect.top;
    const W = canvas.clientWidth, H = canvas.clientHeight;
    const vals = gridData.values;
    const rows = vals.length, cols = vals[0].length;
    const baseScale = getBaseScale(rows, cols);
    const s = baseScale * viewState.scale;
    const mapW = cols * s, mapH = rows * s;
    const latsAsc = gridData.latitude[0] < gridData.latitude[rows-1];
    let gi = Math.floor(((py - viewState.offsetY) / mapH) * rows);
    if (latsAsc) gi = rows - 1 - gi;
    const gj = Math.floor(((px - viewState.offsetX) / mapW) * cols);
    if (gi >= 0 && gi < rows && gj >= 0 && gj < cols) {
        tooltip.style.display = "block";
        tooltip.style.left = (px + 12) + "px";
        tooltip.style.top = (py - 8) + "px";
        tooltip.textContent = `${gridData.latitude[gi].toFixed(2)}\u00b0, ${gridData.longitude[gj].toFixed(2)}\u00b0 \u2192 ${gridData.values[gi][gj].toFixed(2)} ${gridData.unit}`;
    } else {
        tooltip.style.display = "none";
    }
});
canvas.addEventListener("mousedown", (e) => {
    isDragging = true;
    dragStart = { x: e.clientX, y: e.clientY };
    dragOffset = { x: viewState.offsetX, y: viewState.offsetY };
    canvas.style.cursor = "grabbing";
});
canvas.addEventListener("mouseup", () => { isDragging = false; canvas.style.cursor = "crosshair"; });
canvas.addEventListener("mouseleave", () => { isDragging = false; tooltip.style.display = "none"; canvas.style.cursor = "crosshair"; });
canvas.addEventListener("wheel", (e) => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const old = viewState.scale;
    viewState.scale = Math.max(1, Math.min(20, old * (e.deltaY > 0 ? 0.9 : 1.1)));
    viewState.offsetX = mx - (mx - viewState.offsetX) * (viewState.scale / old);
    viewState.offsetY = my - (my - viewState.offsetY) * (viewState.scale / old);
    clampPan();
    render();
}, { passive: false });

// Keyboard: left/right arrows to step through frames
window.addEventListener("keydown", (e) => {
    if (frames.length <= 1) return;
    if (e.key === "ArrowLeft") {
        stopPlay();
        setFrame(Math.max(0, currentFrame - 1));
    } else if (e.key === "ArrowRight") {
        stopPlay();
        setFrame(Math.min(frames.length - 1, currentFrame + 1));
    } else if (e.key === " ") {
        e.preventDefault();
        if (playing) stopPlay(); else startPlay();
    }
});

// --- Resize ---
window.addEventListener("resize", render);

// --- Message handler ---
window.addEventListener("message", async (event) => {
    if (event.data.type === "LOAD_GRID") {
        loadingEl.textContent = "Loading grid data...";
        stopPlay();
        try {
            const resp = await fetch(event.data.filepath);
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            const data = await resp.json();
            let coastlines = null;
            if (event.data.coastlinesUrl) {
                try {
                    const r = await fetch(event.data.coastlinesUrl);
                    if (r.ok) coastlines = await r.json();
                } catch (e) {}
            }
            // Store top-level metadata
            gridInitTime = data.init_time || null;

            if (data.fields && typeof data.fields === "object") {
                allFields = {};
                for (const [name, field] of Object.entries(data.fields)) {
                    if (coastlines) field._coastlines = coastlines;
                    allFields[name] = field;
                }
            } else {
                if (coastlines) data._coastlines = coastlines;
                const name = data.variable || "data";
                allFields = { [name]: data };
            }
            const names = Object.keys(allFields);
            fieldSelect.innerHTML = "";
            for (const name of names) {
                const opt = document.createElement("option");
                const field = allFields[name];
                opt.value = name;
                opt.textContent = field.long_name ? `${name} (${field.long_name})` : name;
                fieldSelect.appendChild(opt);
            }
            loadingEl.textContent = "";

            // Restore saved state if provided, otherwise defaults
            let selectedName = names[0];
            if (event.data.savedState) {
                try {
                    const saved = JSON.parse(event.data.savedState);
                    if (saved.viewState) viewState = saved.viewState;
                    if (saved.lockedBaseScale) lockedBaseScale = saved.lockedBaseScale;
                    if (saved.settings) Object.assign(settings, saved.settings);
                    if (saved.currentFrame != null) currentFrame = saved.currentFrame;
                    if (saved.selectedField && allFields[saved.selectedField]) {
                        selectedName = saved.selectedField;
                    }
                    gridToggle.checked = settings.showGrid;
                    coastToggle.checked = settings.showCoast;
                } catch(e) {
                    viewState = { offsetX: 0, offsetY: 0, scale: 1 };
                    currentFrame = 0;
                }
            } else {
                viewState = { offsetX: 0, offsetY: 0, scale: 1 };
                currentFrame = 0;
            }

            gridData = allFields[selectedName];
            fieldSelect.value = selectedName;

            // Prepare time frames
            prepareFrames(gridData);
            if (currentFrame >= frames.length) currentFrame = 0;
            gridData.values = frames[currentFrame] || gridData.values;

            setupTimeControls();

            // Lock base scale
            const rows = gridData.values.length, cols = gridData.values[0].length;
            lockedBaseScale = Math.min(viewer.clientHeight / rows, viewer.clientWidth / cols);
            clampPan();
            render();
        } catch (err) {
            loadingEl.textContent = `Error: ${err.message}`;
            sendToParent("GRID_ERROR", { error: err.message });
        }
    }
});

render();
</script>
</body>
</html>
