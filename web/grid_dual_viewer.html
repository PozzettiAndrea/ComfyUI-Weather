<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a1a2e;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    height: 100vh;
}
#viewer { position: relative; flex: 1; overflow: hidden; display: flex; }
.panel { position: relative; flex: 1; overflow: hidden; }
.panel canvas { display: block; position: absolute; top: 0; left: 0; cursor: crosshair; }
#divider {
    width: 3px; background: #444; cursor: col-resize; flex-shrink: 0;
    z-index: 5;
}
.panel-label {
    position: absolute; top: 6px; left: 8px;
    background: rgba(0,0,0,0.7); padding: 2px 8px; border-radius: 3px;
    font-size: 11px; font-weight: bold; z-index: 4; pointer-events: none;
}
.tooltip {
    position: absolute; display: none;
    background: rgba(0,0,0,0.85); padding: 4px 8px; border-radius: 3px;
    font-size: 11px; pointer-events: none; white-space: nowrap; z-index: 10;
}
/* Shared colorbar (right side of right panel / single panel) */
.colorbar-container {
    position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
    height: 60%; z-index: 4; pointer-events: none;
}
.colorbar-canvas { width: 20px; height: 100%; border: 1px solid rgba(255,255,255,0.3); border-radius: 2px; }
.colorbar-labels {
    position: absolute; right: 26px; top: 0; height: 100%;
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 10px; font-weight: bold; color: #000; white-space: nowrap;
}
#loading {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    font-size: 13px; color: #888; z-index: 20;
}
/* Time bar */
#timebar {
    background: #161622; border-top: 1px solid #333;
    padding: 4px 10px; display: none; gap: 8px; align-items: center;
    font-size: 11px; flex-shrink: 0;
}
#timebar.visible { display: flex; }
#t-play {
    background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 1px 6px; font-size: 12px; cursor: pointer;
    width: 24px; text-align: center;
}
#t-play:hover { background: #444; }
#t-slider { flex: 1; height: 4px; accent-color: #3b82f6; cursor: pointer; }
#t-label {
    color: #aaa; font-family: monospace; font-size: 10px;
    min-width: 130px; text-align: right; white-space: nowrap;
}
/* Controls */
#controls {
    background: #1a1a1a; border-top: 1px solid #444;
    padding: 5px 10px; display: flex; gap: 8px; align-items: center;
    flex-wrap: wrap; font-size: 11px; flex-shrink: 0;
}
#controls label { display: flex; align-items: center; gap: 3px; cursor: pointer; color: #bbb; }
#controls select {
    background: #2a2a2a; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 1px 4px; font-size: 10px;
}
#controls button {
    background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 1px 8px; font-size: 10px; cursor: pointer;
}
#controls button:hover { background: #444; }
.sep { width: 1px; height: 14px; background: #444; }
/* Settings overlay */
#settingsOverlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 1999; display: none;
}
#settingsOverlay.visible { display: block; }
#settingsPanel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: #222; border: 1px solid #555; border-radius: 6px;
    padding: 14px 16px; z-index: 2000; display: none;
    width: 280px; max-height: 90%; overflow-y: auto;
}
#settingsPanel.visible { display: block; }
#settingsPanel h3 { margin-bottom: 10px; font-size: 12px; color: #ddd; }
.sr { display: flex; align-items: center; margin-bottom: 8px; font-size: 11px; }
.sr label { width: 95px; flex-shrink: 0; color: #aaa; }
.sr input, .sr select {
    flex: 1; background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 3px 6px; font-size: 11px;
}
.sr input[type="number"] { width: 70px; }
.sr input[type="checkbox"] { flex: 0; width: 14px; height: 14px; }
.sr input:disabled { opacity: 0.4; }
.btn-row {
    display: flex; gap: 8px; justify-content: flex-end;
    margin-top: 12px; padding-top: 10px; border-top: 1px solid #444;
}
.btn-row button {
    background: #333; color: #ccc; border: 1px solid #555;
    border-radius: 3px; padding: 3px 14px; font-size: 11px; cursor: pointer;
}
.btn-row button:hover { background: #444; }
.btn-row button.primary { background: #2563eb; border-color: #3b82f6; }
.btn-row button.primary:hover { background: #1d4ed8; }
</style>
</head>
<body>
<div id="viewer">
    <div id="panel-left" class="panel">
        <canvas id="canvas-left"></canvas>
        <div id="label-left" class="panel-label"></div>
        <div id="tooltip-left" class="tooltip"></div>
        <div id="cb-left" class="colorbar-container">
            <canvas class="colorbar-canvas" id="cb-canvas-left"></canvas>
            <div class="colorbar-labels">
                <span id="cb-max-left"></span>
                <span id="cb-mid-left"></span>
                <span id="cb-min-left"></span>
            </div>
        </div>
    </div>
    <div id="divider"></div>
    <div id="panel-right" class="panel">
        <canvas id="canvas-right"></canvas>
        <div id="label-right" class="panel-label"></div>
        <div id="tooltip-right" class="tooltip"></div>
        <div id="cb-right" class="colorbar-container">
            <canvas class="colorbar-canvas" id="cb-canvas-right"></canvas>
            <div class="colorbar-labels">
                <span id="cb-max-right"></span>
                <span id="cb-mid-right"></span>
                <span id="cb-min-right"></span>
            </div>
        </div>
    </div>
    <div id="loading">Waiting for data...</div>
    <div id="settingsOverlay"></div>
    <div id="settingsPanel">
        <h3>Settings</h3>
        <div class="sr"><label>Colormap</label>
            <select id="s-colormap">
                <option value="Viridis">Viridis</option>
                <option value="RdBu_r">RdBu (diverging)</option>
                <option value="Plasma">Plasma</option>
                <option value="Turbo">Turbo</option>
                <option value="Coolwarm">Coolwarm</option>
            </select>
        </div>
        <div class="sr"><label>Diff Colormap</label>
            <select id="s-diffcolormap">
                <option value="RdBu_r">RdBu (diverging)</option>
                <option value="Coolwarm">Coolwarm</option>
                <option value="Viridis">Viridis</option>
                <option value="Plasma">Plasma</option>
                <option value="Turbo">Turbo</option>
            </select>
        </div>
        <div class="sr"><label>Auto Range</label><input type="checkbox" id="s-autorange" checked></div>
        <div class="sr"><label>Color Min</label><input type="number" id="s-cmin" step="any" disabled></div>
        <div class="sr"><label>Color Max</label><input type="number" id="s-cmax" step="any" disabled></div>
        <div class="sr"><label>Grid Color</label><input type="color" id="s-gridcolor" value="#000000"></div>
        <div class="sr"><label>Grid Width</label><input type="number" id="s-gridwidth" min="0.1" max="5" step="0.1" value="0.5"></div>
        <div class="sr"><label>Grid Opacity</label><input type="number" id="s-gridopacity" min="0" max="1" step="0.05" value="0.15"></div>
        <div class="sr"><label>Coast Width</label><input type="number" id="s-coastwidth" min="0.1" max="5" step="0.1" value="0.8"></div>
        <div class="sr"><label>Coast Opacity</label><input type="number" id="s-coastopacity" min="0" max="1" step="0.05" value="0.5"></div>
        <div class="btn-row">
            <button id="s-cancel">Cancel</button>
            <button id="s-apply" class="primary">Apply</button>
        </div>
    </div>
</div>
<div id="timebar">
    <button id="t-play" title="Play/Pause">&#9654;</button>
    <input type="range" id="t-slider" min="0" max="0" value="0" step="1">
    <span id="t-label">--</span>
</div>
<div id="controls">
    <label><input type="checkbox" id="c-grid" checked> Grid</label>
    <label><input type="checkbox" id="c-coast" checked> Coast</label>
    <div class="sep"></div>
    <label>Colormap <select id="c-cmap">
        <option value="Viridis" selected>Viridis</option>
        <option value="RdBu_r">RdBu (diverging)</option>
        <option value="Plasma">Plasma</option>
        <option value="Turbo">Turbo</option>
        <option value="Coolwarm">Coolwarm</option>
    </select></label>
    <div class="sep"></div>
    <button id="c-settings">Settings</button>
    <button id="c-reset">Reset</button>
</div>

<script>
// ─── State ───
let dualData = null;   // parsed JSON
let mode = "side_by_side"; // or "difference"
let coastlines = null;

// Two field objects (side-by-side) or one (difference)
let fieldLeft = null, fieldRight = null;
let framesLeft = [], framesRight = [];
let timestampsLeft = [], timestampsRight = [];
let currentFrame = 0;
let playing = false, playTimer = null, playSpeed = 200;

let viewState = { offsetX: 0, offsetY: 0, scale: 1 };
let lockedBaseScale = null;
let isDragging = false, dragStart = {x:0,y:0}, dragOffset = {x:0,y:0};

let settings = {
    colormap: "Viridis", diffColormap: "RdBu_r",
    autoRange: true, cmin: 0, cmax: 1,
    showGrid: true, showCoast: true,
    gridColor: "#000000", gridWidth: 0.5, gridOpacity: 0.15,
    coastWidth: 0.8, coastOpacity: 0.5,
};

// ─── Colormaps ───
const COLORMAPS = {
    RdBu_r: [
        [0.0,[103,0,31]],[0.1,[178,24,43]],[0.2,[214,96,77]],
        [0.3,[244,165,130]],[0.4,[253,219,199]],[0.5,[247,247,247]],
        [0.6,[209,229,240]],[0.7,[146,197,222]],[0.8,[67,147,195]],
        [0.9,[33,102,172]],[1.0,[5,48,97]]
    ],
    Viridis: [
        [0.0,[68,1,84]],[0.125,[72,36,117]],[0.25,[56,88,140]],
        [0.375,[39,126,142]],[0.5,[31,161,135]],[0.625,[74,194,109]],
        [0.75,[159,218,58]],[0.875,[222,240,39]],[1.0,[253,231,37]]
    ],
    Plasma: [
        [0.0,[13,8,135]],[0.125,[84,2,163]],[0.25,[139,10,165]],
        [0.375,[185,50,137]],[0.5,[219,92,104]],[0.625,[244,136,73]],
        [0.75,[254,188,43]],[0.875,[240,230,33]],[1.0,[240,249,33]]
    ],
    Turbo: [
        [0.0,[48,18,59]],[0.125,[62,109,204]],[0.25,[32,185,232]],
        [0.375,[23,232,162]],[0.5,[117,251,76]],[0.625,[213,226,26]],
        [0.75,[252,166,10]],[0.875,[230,84,8]],[1.0,[122,4,3]]
    ],
    Coolwarm: [
        [0.0,[59,76,192]],[0.25,[141,176,254]],[0.5,[221,221,221]],
        [0.75,[245,152,105]],[1.0,[180,4,38]]
    ],
};

function lerp(cmap, t) {
    t = Math.max(0, Math.min(1, t));
    for (let i = 0; i < cmap.length - 1; i++) {
        if (t >= cmap[i][0] && t <= cmap[i+1][0]) {
            const f = (t - cmap[i][0]) / (cmap[i+1][0] - cmap[i][0]);
            const a = cmap[i][1], b = cmap[i+1][1];
            return [
                Math.round(a[0]+f*(b[0]-a[0])),
                Math.round(a[1]+f*(b[1]-a[1])),
                Math.round(a[2]+f*(b[2]-a[2]))
            ];
        }
    }
    return cmap[cmap.length-1][1];
}

function sendToParent(type, data = {}) {
    if (window.parent && window.parent !== window)
        window.parent.postMessage({ type, ...data }, "*");
}

// ─── Elements ───
const viewer = document.getElementById("viewer");
const panelLeft = document.getElementById("panel-left");
const panelRight = document.getElementById("panel-right");
const canvasLeft = document.getElementById("canvas-left");
const canvasRight = document.getElementById("canvas-right");
const ctxLeft = canvasLeft.getContext("2d");
const ctxRight = canvasRight.getContext("2d");
const tooltipLeft = document.getElementById("tooltip-left");
const tooltipRight = document.getElementById("tooltip-right");
const labelLeft = document.getElementById("label-left");
const labelRight = document.getElementById("label-right");
const divider = document.getElementById("divider");
const loadingEl = document.getElementById("loading");
const slider = document.getElementById("t-slider");
const timeLabel = document.getElementById("t-label");
const playBtn = document.getElementById("t-play");
const timebar = document.getElementById("timebar");

// ─── Frames ───
function prepareFrames(fieldData) {
    const vals = fieldData.values;
    if (!vals || !vals.length) return { frames: [], timestamps: [] };
    if (Array.isArray(vals[0]) && Array.isArray(vals[0][0])) {
        const ts = fieldData.timestamps || [];
        while (ts.length < vals.length) ts.push(`Frame ${ts.length}`);
        return { frames: vals, timestamps: ts };
    }
    return { frames: [vals], timestamps: [fieldData.timestamp || ""] };
}

function setFrame(idx) {
    const maxFrames = Math.max(framesLeft.length, framesRight.length);
    if (idx < 0 || idx >= maxFrames) return;
    currentFrame = idx;
    if (fieldLeft && framesLeft[currentFrame]) fieldLeft.values = framesLeft[currentFrame];
    if (fieldRight && framesRight[currentFrame]) fieldRight.values = framesRight[currentFrame];
    slider.value = currentFrame;
    updateTimeLabel();
    render();
}

function updateTimeLabel() {
    const ts = timestampsLeft[currentFrame] || timestampsRight[currentFrame] || "";
    const maxFrames = Math.max(framesLeft.length, framesRight.length);
    timeLabel.textContent = `${currentFrame + 1}/${maxFrames}  ${ts.replace("T", " ")}`;
}

function setupTimeControls() {
    const maxFrames = Math.max(framesLeft.length, framesRight.length);
    if (maxFrames > 1) {
        slider.min = 0;
        slider.max = maxFrames - 1;
        slider.value = currentFrame;
        timebar.classList.add("visible");
        updateTimeLabel();
    } else {
        timebar.classList.remove("visible");
    }
}

// ─── Rendering ───
function getBaseScale(rows, cols, panelW, panelH) {
    if (lockedBaseScale) return lockedBaseScale;
    return Math.min(panelH / rows, panelW / cols);
}

function computeRange(vals) {
    let vmin = Infinity, vmax = -Infinity;
    const rows = vals.length, cols = vals[0].length;
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const v = vals[r][c];
            if (v < vmin) vmin = v;
            if (v > vmax) vmax = v;
        }
    }
    return [vmin, vmax];
}

function renderPanel(canvas, ctx, field, panelEl, tooltipEl, cbCanvasId, cbMaxId, cbMidId, cbMinId, vminOverride, vmaxOverride) {
    if (!field || !field.values) return;
    const dpr = window.devicePixelRatio || 1;
    const W = panelEl.clientWidth;
    const H = panelEl.clientHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const vals = field.values;
    const rows = vals.length, cols = vals[0].length;
    const cmap = COLORMAPS[settings.colormap] || COLORMAPS.Viridis;

    const [dataMin, dataMax] = computeRange(vals);
    const vmin = vminOverride != null ? vminOverride : (settings.autoRange ? dataMin : settings.cmin);
    const vmax = vmaxOverride != null ? vmaxOverride : (settings.autoRange ? dataMax : settings.cmax);
    const vrange = vmax - vmin || 1;
    const latsAsc = field.latitude[0] < field.latitude[rows - 1];

    const baseScale = getBaseScale(rows, cols, W, H);
    const s = baseScale * viewState.scale;
    const mapW = cols * s, mapH = rows * s;
    const ox = viewState.offsetX, oy = viewState.offsetY;

    // Clear
    ctx.fillStyle = "#1a1a2e";
    ctx.fillRect(0, 0, W, H);

    // Heatmap
    const offscreen = document.createElement("canvas");
    offscreen.width = W; offscreen.height = H;
    const offCtx = offscreen.getContext("2d");
    const imgData = offCtx.createImageData(W, H);
    const d = imgData.data;
    const bgR = 26, bgG = 26, bgB = 46;
    for (let py = 0; py < H; py++) {
        let gi = Math.floor(((py - oy) / mapH) * rows);
        if (latsAsc) gi = rows - 1 - gi;
        const rowOOB = gi < 0 || gi >= rows;
        for (let px = 0; px < W; px++) {
            const idx = (py * W + px) * 4;
            if (rowOOB) { d[idx]=bgR; d[idx+1]=bgG; d[idx+2]=bgB; d[idx+3]=255; continue; }
            const gj = Math.floor(((px - ox) / mapW) * cols);
            if (gj < 0 || gj >= cols) { d[idx]=bgR; d[idx+1]=bgG; d[idx+2]=bgB; d[idx+3]=255; continue; }
            const t = (vals[gi][gj] - vmin) / vrange;
            const c = lerp(cmap, t);
            d[idx]=c[0]; d[idx+1]=c[1]; d[idx+2]=c[2]; d[idx+3]=255;
        }
    }
    offCtx.putImageData(imgData, 0, 0);
    ctx.drawImage(offscreen, 0, 0);

    // Coastlines
    if (settings.showCoast && coastlines) {
        const lats = field.latitude, lons = field.longitude;
        const latMin = Math.min(lats[0], lats[lats.length-1]);
        const latMax = Math.max(lats[0], lats[lats.length-1]);
        const lonMin = Math.min(lons[0], lons[lons.length-1]);
        const lonMax = Math.max(lons[0], lons[lons.length-1]);
        const latR = latMax - latMin || 1, lonR = lonMax - lonMin || 1;
        ctx.save();
        ctx.beginPath(); ctx.rect(ox, oy, mapW, mapH); ctx.clip();
        ctx.strokeStyle = `rgba(255,255,255,${settings.coastOpacity})`;
        ctx.lineWidth = settings.coastWidth;
        for (const seg of coastlines) {
            ctx.beginPath();
            let started = false;
            for (const [lon, lat] of seg) {
                const nx = (lon - lonMin) / lonR;
                const ny = (latMax - lat) / latR;
                const px = ox + nx * mapW;
                const py = oy + ny * mapH;
                if (!started) { ctx.moveTo(px, py); started = true; }
                else ctx.lineTo(px, py);
            }
            ctx.stroke();
        }
        ctx.restore();
    }

    // Grid lines
    if (settings.showGrid) {
        const cellW = mapW / cols, cellH = mapH / rows;
        if (cellW > 3 || cellH > 3) {
            const gc = settings.gridColor;
            const gr = parseInt(gc.slice(1,3),16), gg = parseInt(gc.slice(3,5),16), gb = parseInt(gc.slice(5,7),16);
            ctx.strokeStyle = `rgba(${gr},${gg},${gb},${settings.gridOpacity})`;
            ctx.lineWidth = settings.gridWidth;
            if (cellH > 3) for (let i = 0; i <= rows; i++) {
                const py = oy + (i / rows) * mapH;
                if (py >= -1 && py <= H + 1) { ctx.beginPath(); ctx.moveTo(ox, py); ctx.lineTo(ox + mapW, py); ctx.stroke(); }
            }
            if (cellW > 3) for (let j = 0; j <= cols; j++) {
                const px = ox + (j / cols) * mapW;
                if (px >= -1 && px <= W + 1) { ctx.beginPath(); ctx.moveTo(px, oy); ctx.lineTo(px, oy + mapH); ctx.stroke(); }
            }
        }
    }

    // Colorbar
    renderColorbar(vmin, vmax, cmap, cbCanvasId, cbMaxId, cbMidId, cbMinId, field.unit || "");

    return { vmin, vmax, dataMin, dataMax, rows, cols };
}

function renderColorbar(vmin, vmax, cmap, canvasId, maxId, midId, minId, unit) {
    const cb = document.getElementById(canvasId);
    if (!cb) return;
    const c = cb.getContext("2d");
    const dpr = window.devicePixelRatio || 1;
    cb.width = 20 * dpr;
    cb.height = cb.clientHeight * dpr;
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    const h = cb.clientHeight;
    for (let y = 0; y < h; y++) {
        const col = lerp(cmap, y / h);
        c.fillStyle = `rgb(${col[0]},${col[1]},${col[2]})`;
        c.fillRect(0, y, 20, 1);
    }
    const u = unit ? ` ${unit}` : "";
    document.getElementById(maxId).textContent = vmax.toFixed(1) + u;
    document.getElementById(midId).textContent = ((vmin + vmax) / 2).toFixed(1) + u;
    document.getElementById(minId).textContent = vmin.toFixed(1) + u;
}

function render() {
    if (mode === "side_by_side") {
        // Compute shared range across both panels
        let globalMin = Infinity, globalMax = -Infinity;
        if (fieldLeft?.values) {
            const [a, b] = computeRange(fieldLeft.values);
            globalMin = Math.min(globalMin, a);
            globalMax = Math.max(globalMax, b);
        }
        if (fieldRight?.values) {
            const [a, b] = computeRange(fieldRight.values);
            globalMin = Math.min(globalMin, a);
            globalMax = Math.max(globalMax, b);
        }

        renderPanel(canvasLeft, ctxLeft, fieldLeft, panelLeft, tooltipLeft,
            "cb-canvas-left", "cb-max-left", "cb-mid-left", "cb-min-left",
            globalMin, globalMax);
        renderPanel(canvasRight, ctxRight, fieldRight, panelRight, tooltipRight,
            "cb-canvas-right", "cb-max-right", "cb-mid-right", "cb-min-right",
            globalMin, globalMax);

        // Hide left colorbar in side-by-side (shared range shown on right)
        document.getElementById("cb-left").style.display = "none";
        document.getElementById("cb-right").style.display = "";

        sendInfo();
    } else {
        // Difference mode — single panel (left), hide right
        document.getElementById("cb-left").style.display = "";
        document.getElementById("cb-right").style.display = "none";

        // Use diff colormap for difference mode
        const savedCmap = settings.colormap;
        settings.colormap = settings.diffColormap;
        renderPanel(canvasLeft, ctxLeft, fieldLeft, panelLeft, tooltipLeft,
            "cb-canvas-left", "cb-max-left", "cb-mid-left", "cb-min-left",
            null, null);
        settings.colormap = savedCmap;
        sendInfo();
    }

    persistState();
}

function sendInfo() {
    let info = "";
    if (mode === "side_by_side" && fieldLeft && fieldRight) {
        const ts = timestampsLeft[currentFrame] || "";
        const maxFrames = Math.max(framesLeft.length, framesRight.length);
        const frameInfo = maxFrames > 1 ? `  Frame ${currentFrame+1}/${maxFrames}` : "";
        const [lMin, lMax] = computeRange(fieldLeft.values);
        const [rMin, rMax] = computeRange(fieldRight.values);
        info =
            `${fieldLeft.long_name || fieldLeft.variable}  vs  ${fieldRight.long_name || fieldRight.variable}\n` +
            `${ts.replace("T"," ")}${frameInfo}  [${fieldLeft.unit}]\n` +
            `Left: ${lMin.toFixed(1)} to ${lMax.toFixed(1)}  |  Right: ${rMin.toFixed(1)} to ${rMax.toFixed(1)}`;
    } else if (mode === "difference" && fieldLeft) {
        const ts = timestampsLeft[currentFrame] || "";
        const maxFrames = framesLeft.length;
        const frameInfo = maxFrames > 1 ? `  Frame ${currentFrame+1}/${maxFrames}` : "";
        const [dMin, dMax] = computeRange(fieldLeft.values);
        info =
            `${fieldLeft.long_name || "Difference"}  [${fieldLeft.unit}]\n` +
            `${ts.replace("T"," ")}${frameInfo}\n` +
            `Range: ${dMin.toFixed(2)} to ${dMax.toFixed(2)} ${fieldLeft.unit}`;
    }
    sendToParent("DUAL_INFO", { info });
}

function persistState() {
    sendToParent("VIEW_STATE", {
        state: JSON.stringify({ viewState, settings, currentFrame, lockedBaseScale })
    });
}

// ─── Layout ───
function applyLayout() {
    if (mode === "side_by_side") {
        panelRight.style.display = "";
        divider.style.display = "";
    } else {
        panelRight.style.display = "none";
        divider.style.display = "none";
    }
}

// ─── Pan / Zoom (synced across both panels) ───
function clampPan() {
    const field = fieldLeft || fieldRight;
    if (!field || !field.values) return;
    const panel = (mode === "side_by_side") ? panelLeft : panelLeft;
    const W = panel.clientWidth, H = panel.clientHeight;
    const vals = field.values;
    const rows = vals.length, cols = vals[0].length;
    const s = getBaseScale(rows, cols, W, H) * viewState.scale;
    const mapW = cols * s, mapH = rows * s;
    if (mapW <= W) viewState.offsetX = (W - mapW) / 2;
    else viewState.offsetX = Math.min(W * 0.25, Math.max(W - mapW - W * 0.25, viewState.offsetX));
    if (mapH <= H) viewState.offsetY = (H - mapH) / 2;
    else viewState.offsetY = Math.min(H * 0.25, Math.max(H - mapH - H * 0.25, viewState.offsetY));
}

function setupMouse(canvas, panel, tooltipEl, getField) {
    canvas.addEventListener("mousemove", (e) => {
        const field = getField();
        if (!field || !field.values) return;
        if (isDragging) {
            viewState.offsetX = dragOffset.x + (e.clientX - dragStart.x);
            viewState.offsetY = dragOffset.y + (e.clientY - dragStart.y);
            clampPan();
            render();
            return;
        }
        const rect = canvas.getBoundingClientRect();
        const px = e.clientX - rect.left, py = e.clientY - rect.top;
        const W = panel.clientWidth, H = panel.clientHeight;
        const vals = field.values;
        const rows = vals.length, cols = vals[0].length;
        const baseScale = getBaseScale(rows, cols, W, H);
        const s = baseScale * viewState.scale;
        const mapW = cols * s, mapH = rows * s;
        const latsAsc = field.latitude[0] < field.latitude[rows-1];
        let gi = Math.floor(((py - viewState.offsetY) / mapH) * rows);
        if (latsAsc) gi = rows - 1 - gi;
        const gj = Math.floor(((px - viewState.offsetX) / mapW) * cols);
        if (gi >= 0 && gi < rows && gj >= 0 && gj < cols) {
            tooltipEl.style.display = "block";
            tooltipEl.style.left = (px + 12) + "px";
            tooltipEl.style.top = (py - 8) + "px";
            tooltipEl.textContent = `${field.latitude[gi].toFixed(2)}\u00b0, ${field.longitude[gj].toFixed(2)}\u00b0 \u2192 ${vals[gi][gj].toFixed(2)} ${field.unit || ""}`;
        } else {
            tooltipEl.style.display = "none";
        }
    });
    canvas.addEventListener("mousedown", (e) => {
        isDragging = true;
        dragStart = { x: e.clientX, y: e.clientY };
        dragOffset = { x: viewState.offsetX, y: viewState.offsetY };
        canvas.style.cursor = "grabbing";
    });
    canvas.addEventListener("mouseup", () => { isDragging = false; canvas.style.cursor = "crosshair"; });
    canvas.addEventListener("mouseleave", () => { isDragging = false; tooltipEl.style.display = "none"; canvas.style.cursor = "crosshair"; });
    canvas.addEventListener("wheel", (e) => {
        e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        const old = viewState.scale;
        viewState.scale = Math.max(1, Math.min(20, old * (e.deltaY > 0 ? 0.9 : 1.1)));
        viewState.offsetX = mx - (mx - viewState.offsetX) * (viewState.scale / old);
        viewState.offsetY = my - (my - viewState.offsetY) * (viewState.scale / old);
        clampPan();
        render();
    }, { passive: false });
}

setupMouse(canvasLeft, panelLeft, tooltipLeft, () => fieldLeft);
setupMouse(canvasRight, panelRight, tooltipRight, () => fieldRight);

// ─── Time controls ───
slider.addEventListener("input", () => setFrame(parseInt(slider.value)));
playBtn.addEventListener("click", () => { playing ? stopPlay() : startPlay(); });

function startPlay() {
    const maxFrames = Math.max(framesLeft.length, framesRight.length);
    if (maxFrames <= 1) return;
    playing = true;
    playBtn.textContent = "\u23F8";
    playTimer = setInterval(() => {
        let next = currentFrame + 1;
        if (next >= maxFrames) next = 0;
        setFrame(next);
    }, playSpeed);
}

function stopPlay() {
    playing = false;
    playBtn.textContent = "\u25B6";
    if (playTimer) { clearInterval(playTimer); playTimer = null; }
}

// Keyboard
window.addEventListener("keydown", (e) => {
    const maxFrames = Math.max(framesLeft.length, framesRight.length);
    if (maxFrames <= 1) return;
    if (e.key === "ArrowLeft") { stopPlay(); setFrame(Math.max(0, currentFrame - 1)); }
    else if (e.key === "ArrowRight") { stopPlay(); setFrame(Math.min(maxFrames - 1, currentFrame + 1)); }
    else if (e.key === " ") { e.preventDefault(); playing ? stopPlay() : startPlay(); }
});

// ─── Controls ───
document.getElementById("c-grid").addEventListener("change", (e) => { settings.showGrid = e.target.checked; render(); });
document.getElementById("c-coast").addEventListener("change", (e) => { settings.showCoast = e.target.checked; render(); });
document.getElementById("c-cmap").addEventListener("change", (e) => { settings.colormap = e.target.value; render(); });
document.getElementById("c-reset").addEventListener("click", () => {
    viewState = { offsetX: 0, offsetY: 0, scale: 1 };
    lockedBaseScale = null;
    render();
});

// ─── Settings panel ───
const settingsPanel = document.getElementById("settingsPanel");
const settingsOverlay = document.getElementById("settingsOverlay");
const autoRangeCheck = document.getElementById("s-autorange");
const cminInput = document.getElementById("s-cmin");
const cmaxInput = document.getElementById("s-cmax");

function openSettings() {
    document.getElementById("s-colormap").value = settings.colormap;
    document.getElementById("s-diffcolormap").value = settings.diffColormap;
    autoRangeCheck.checked = settings.autoRange;
    cminInput.disabled = settings.autoRange;
    cmaxInput.disabled = settings.autoRange;
    cminInput.value = settings.cmin;
    cmaxInput.value = settings.cmax;
    document.getElementById("s-gridcolor").value = settings.gridColor;
    document.getElementById("s-gridwidth").value = settings.gridWidth;
    document.getElementById("s-gridopacity").value = settings.gridOpacity;
    document.getElementById("s-coastwidth").value = settings.coastWidth;
    document.getElementById("s-coastopacity").value = settings.coastOpacity;
    settingsPanel.classList.add("visible");
    settingsOverlay.classList.add("visible");
}
function closeSettings() {
    settingsPanel.classList.remove("visible");
    settingsOverlay.classList.remove("visible");
}
autoRangeCheck.addEventListener("change", () => {
    cminInput.disabled = autoRangeCheck.checked;
    cmaxInput.disabled = autoRangeCheck.checked;
});
document.getElementById("c-settings").addEventListener("click", openSettings);
settingsOverlay.addEventListener("click", closeSettings);
document.getElementById("s-cancel").addEventListener("click", closeSettings);
document.getElementById("s-apply").addEventListener("click", () => {
    settings.colormap = document.getElementById("s-colormap").value;
    settings.diffColormap = document.getElementById("s-diffcolormap").value;
    settings.autoRange = autoRangeCheck.checked;
    if (!settings.autoRange) {
        settings.cmin = parseFloat(cminInput.value);
        settings.cmax = parseFloat(cmaxInput.value);
    }
    settings.gridColor = document.getElementById("s-gridcolor").value;
    settings.gridWidth = parseFloat(document.getElementById("s-gridwidth").value);
    settings.gridOpacity = parseFloat(document.getElementById("s-gridopacity").value);
    settings.coastWidth = parseFloat(document.getElementById("s-coastwidth").value);
    settings.coastOpacity = parseFloat(document.getElementById("s-coastopacity").value);
    // Sync the control bar dropdown
    document.getElementById("c-cmap").value = settings.colormap;
    closeSettings();
    render();
});

// ─── Resize ───
window.addEventListener("resize", render);

// ─── Load data ───
window.addEventListener("message", async (event) => {
    if (event.data.type !== "LOAD_DUAL_GRID") return;
    loadingEl.textContent = "Loading dual grid data...";
    stopPlay();
    try {
        const resp = await fetch(event.data.filepath);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        dualData = await resp.json();

        // Load coastlines
        if (event.data.coastlinesUrl) {
            try {
                const r = await fetch(event.data.coastlinesUrl);
                if (r.ok) coastlines = await r.json();
            } catch(e) {}
        }

        mode = dualData.mode || "side_by_side";
        applyLayout();

        if (mode === "side_by_side") {
            fieldLeft = dualData.field_1;
            fieldRight = dualData.field_2;
            if (coastlines) { fieldLeft._coastlines = coastlines; fieldRight._coastlines = coastlines; }
            labelLeft.textContent = dualData.model_1;
            labelRight.textContent = dualData.model_2;

            const fl = prepareFrames(fieldLeft);
            framesLeft = fl.frames; timestampsLeft = fl.timestamps;
            const fr = prepareFrames(fieldRight);
            framesRight = fr.frames; timestampsRight = fr.timestamps;
        } else {
            // Difference
            fieldLeft = dualData.diff;
            fieldRight = null;
            if (coastlines) fieldLeft._coastlines = coastlines;
            labelLeft.textContent = `${dualData.model_1} \u2212 ${dualData.model_2}`;
            labelRight.textContent = "";

            const fl = prepareFrames(fieldLeft);
            framesLeft = fl.frames; timestampsLeft = fl.timestamps;
            framesRight = []; timestampsRight = [];
        }

        // Restore saved state
        if (event.data.savedState) {
            try {
                const saved = JSON.parse(event.data.savedState);
                if (saved.viewState) viewState = saved.viewState;
                if (saved.settings) Object.assign(settings, saved.settings);
                if (saved.currentFrame != null) currentFrame = saved.currentFrame;
                if (saved.lockedBaseScale) lockedBaseScale = saved.lockedBaseScale;
                document.getElementById("c-grid").checked = settings.showGrid;
                document.getElementById("c-coast").checked = settings.showCoast;
                document.getElementById("c-cmap").value = settings.colormap;
            } catch(e) {
                viewState = { offsetX: 0, offsetY: 0, scale: 1 };
                currentFrame = 0;
            }
        } else {
            viewState = { offsetX: 0, offsetY: 0, scale: 1 };
            currentFrame = 0;
        }

        // Set current frame
        if (fieldLeft && framesLeft[currentFrame]) fieldLeft.values = framesLeft[currentFrame];
        if (fieldRight && framesRight[currentFrame]) fieldRight.values = framesRight[currentFrame];

        setupTimeControls();
        loadingEl.textContent = "";
        render();
    } catch (err) {
        loadingEl.textContent = `Error: ${err.message}`;
        sendToParent("DUAL_ERROR", { error: err.message });
    }
});
</script>
</body>
</html>
